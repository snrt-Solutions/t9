name: AeSMS
options:
  bundleIdPrefix: io.aesms
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AeSMS:
    type: application
    platform: iOS
    sources:
      - path: AeSMS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.aesms.app
        INFOPLIST_FILE: AeSMS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: AeSMS/AeSMS.entitlements
    entitlements:
      path: AeSMS/AeSMS.entitlements
      properties:
        aps-environment: development
