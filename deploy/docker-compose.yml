services:
  aesms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aesms
    restart: unless-stopped
    environment:
      AESMS_LISTEN: ":8080"
      AESMS_DATA: /data
      # Prefer https://app.aesms.io when the tunnel is the public origin.
      AESMS_BASE_URL: ${AESMS_BASE_URL:-https://app.aesms.io}
      AESMS_DB_KEY: ${AESMS_DB_KEY:-}
      AESMS_RESET_DB: ${AESMS_RESET_DB:-}
      AESMS_APNS_KEY_ID: ${AESMS_APNS_KEY_ID:-}
      AESMS_APNS_TEAM_ID: ${AESMS_APNS_TEAM_ID:-}
      AESMS_APNS_KEY_PATH: ${AESMS_APNS_KEY_PATH:-}
      AESMS_APNS_BUNDLE_ID: ${AESMS_APNS_BUNDLE_ID:-io.aesms.app}
      AESMS_APNS_PRODUCTION: ${AESMS_APNS_PRODUCTION:-}
      AESMS_TURNSTILE_SITE_KEY: ${AESMS_TURNSTILE_SITE_KEY:-}
      AESMS_TURNSTILE_SECRET: ${AESMS_TURNSTILE_SECRET:-}
      AESMS_RATE_LIMIT_DISABLED: ${AESMS_RATE_LIMIT_DISABLED:-}
    volumes:
      - aesms-data:/data
    # Private origin: reachable only on the Compose network (not published on the host).
    expose:
      - "8080"
    networks:
      - aesms-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aesms-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Official cloudflared env name; value comes from deploy/.env (never commit).
      # Required when this service runs (production / --profile tunnel). Optional for local FE.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - aesms
    networks:
      - aesms-net
    # Do not mount secrets into the image; do not publish ports.
    # Public hostname (app.aesms.io → http://aesms:8080) is configured in Cloudflare Zero Trust.

networks:
  aesms-net:
    driver: bridge

volumes:
  aesms-data:
