services:
  t9:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: t9
    restart: unless-stopped
    environment:
      T9_LISTEN: ":8080"
      T9_DATA: /data
      T9_BASE_URL: ${T9_BASE_URL:-http://127.0.0.1:8080}
      T9_DB_KEY: ${T9_DB_KEY:?set T9_DB_KEY to a long random secret}
      T9_RESET_DB: ${T9_RESET_DB:-}
    volumes:
      - t9-data:/data
    ports:
      - "${T9_PORT:-8080}:8080"

  # Optional: Cloudflare Tunnel sidecar (set CLOUDFLARE_TUNNEL_TOKEN)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: t9-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - t9
    profiles:
      - tunnel

volumes:
  t9-data:
