services:
  t9:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: t9
    restart: unless-stopped
    environment:
      T9_LISTEN: ":8080"
      T9_DATA: /data
      # Optional overrides — prefer first-run UI at /setup.html (writes /data/t9.setup.json)
      T9_BASE_URL: ${T9_BASE_URL:-}
      T9_DB_KEY: ${T9_DB_KEY:-}
      T9_RESET_DB: ${T9_RESET_DB:-}
      T9_APNS_KEY_ID: ${T9_APNS_KEY_ID:-}
      T9_APNS_TEAM_ID: ${T9_APNS_TEAM_ID:-}
      T9_APNS_KEY_PATH: ${T9_APNS_KEY_PATH:-}
      T9_APNS_BUNDLE_ID: ${T9_APNS_BUNDLE_ID:-app.t9.messenger}
      T9_APNS_PRODUCTION: ${T9_APNS_PRODUCTION:-}
    volumes:
      - t9-data:/data
    ports:
      - "${T9_PORT:-8080}:8080"

  # Waits for token written by setup UI to /data/cloudflare.token
  cloudflared:
    build:
      context: ..
      dockerfile: deploy/cloudflared.Dockerfile
    container_name: t9-cloudflared
    restart: unless-stopped
    volumes:
      - t9-data:/data:ro
    depends_on:
      - t9

volumes:
  t9-data:
