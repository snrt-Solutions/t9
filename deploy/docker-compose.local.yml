# Optional local admin access (loopback only). Does not publish a public host port.
#
# Usage (from deploy/):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Then open http://127.0.0.1:8080/setup.html on the Docker host.
# Prefer env-based first boot (AESMS_DB_KEY + AESMS_BASE_URL + CLOUDFLARE_TUNNEL_TOKEN)
# so the default compose file stays private-origin (no host ports).

services:
  aesms:
    ports:
      - "127.0.0.1:${AESMS_LOCAL_PORT:-8080}:8080"
